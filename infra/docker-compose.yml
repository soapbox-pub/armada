# Armada internal stack: multi-tenant zooid relay + LiveKit SFU + web client.
#
# 1. cp .env.example .env  (and fill in keys; see README) — or just run
#    ../start.sh, which generates .env and a default community config.
# 2. docker compose up -d --build
#
# Everything binds to the host only; put your internal reverse proxy / TLS in
# front if you serve beyond localhost.
#
# The relay is zooid (../server): a multi-tenant Nostr relay. Each community is
# a TOML file under ./config (one per host). Add/remove communities by dropping
# files there (hot-reloaded) or via zooid's management REST API (API_HOST).

services:
  relay:
    build: ../server
    restart: unless-stopped
    environment:
      PORT: "5577"
      # zooid storage roots (inside the container).
      CONFIG: /config
      DATA: /data
      MEDIA: /media
      # Management REST API (NIP-98 authed). Two ways to expose it:
      #   - API_HOST: serve it on a dedicated host (whole-Host match).
      #   - API_PATH: mount it under a path prefix (e.g. /api) on EVERY community
      #     host, keeping the relay+client+API on one origin. The client's
      #     VITE_RELAY_API_BASE should then be "<community origin>/api".
      # Whitelisted pubkeys may create/update/delete virtual relays at runtime.
      # Leave both empty to disable the API entirely.
      API_HOST: ${RELAY_API_HOST:-}
      API_PATH: ${RELAY_API_PATH:-}
      API_WHITELIST: ${RELAY_API_WHITELIST:-}
      # Web Push VAPID keys (optional, shared across tenants on this process).
      # Leave empty to auto-generate + persist a per-tenant keypair on first
      # run; pin them to keep public keys stable across DB wipes.
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
    ports:
      - "5577:5577"
    volumes:
      # Per-community TOML configs. start.sh seeds a default one here.
      - ./config:/config
      - relay-data:/data
      - relay-media:/media

  livekit:
    # Pin an exact patch: the server's signaling protocol must match the
    # bundled livekit-client SDK (client/package.json). A skew (e.g. server
    # protocol 15 vs client protocol 17) makes clients fail WebRTC negotiation
    # and full-reconnect every ~16s. Bump this together with the client SDK.
    image: livekit/livekit-server:v1.9.12
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 50000
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: ${LIVEKIT_NODE_IP:-}
          interfaces:
            includes:
              - ${LIVEKIT_IFACE:-eth0}
        turn:
          enabled: ${LIVEKIT_TURN_ENABLED:-false}
          domain: ${LIVEKIT_TURN_DOMAIN:-turn.localhost}
          tls_port: 443
          cert_file: /certs/tls.crt
          key_file: /certs/tls.key
          external_tls: false
        keys:
          ${LIVEKIT_API_KEY:-armada}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-armada}
          urls:
            # zooid's NIP-29 LiveKit webhook path (per-tenant routing is by the
            # room metadata zooid stamps with the owning relay's schema).
            - http://relay:5577/.well-known/nip29/livekit/webhook
    volumes:
      - ${LIVEKIT_CERT_DIR:-./certs/turn}:/certs:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "${LIVEKIT_TURN_PORT:-5349}:443"
      - "50000-50100:50000-50100/udp"

  client:
    build:
      context: ../client
      args:
        VITE_APP_NAME: ${APP_NAME:-Armada}
        VITE_PLATFORM_RELAYS: ${PLATFORM_RELAYS:-ws://localhost:5577}
        VITE_APP_RELAYS: ${APP_RELAYS:-wss://relay.ditto.pub,wss://relay.dreamith.to}
        VITE_SEARCH_RELAYS: ${SEARCH_RELAYS:-wss://relay.ditto.pub,wss://relay.dreamith.to}
        VITE_DEFAULT_NOISE_SUPPRESSION: ${DEFAULT_NOISE_SUPPRESSION:-true}
        VITE_DEFAULT_ECHO_CANCELLATION: ${DEFAULT_ECHO_CANCELLATION:-true}
        VITE_DEFAULT_AUTO_GAIN_CONTROL: ${DEFAULT_AUTO_GAIN_CONTROL:-true}
        # Tenant-management API for the client's "Create a community" flow.
        # Set RELAY_API_PATH (e.g. /api) for the single-origin path mount, or
        # RELAY_API_BASE for a dedicated API host. Both empty hides the UI.
        VITE_RELAY_API_PATH: ${RELAY_API_PATH:-}
        VITE_RELAY_API_BASE: ${RELAY_API_CLIENT_BASE:-}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - relay

volumes:
  relay-data:
  relay-media:
