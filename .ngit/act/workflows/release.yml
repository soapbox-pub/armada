name: Release

# Every artifact of a version tag (vX.Y.Z), and the Nostr release events that
# name them all.
#
#   desktop → android → release
#
# ── Why one workflow file ────────────────────────────────────────────────────
# The `release` job publishes two releases listing all eight installers: the
# kind-30622 NIP-34 repository release (docs/releases.md), which installed
# desktop builds update from, and the NIP-82 software release (kinds
# 32267/30063/3063, .ngit/release.yaml), which Zapstore reads. Both are
# ADDRESSABLE: replacement is whole-event rather than a tag union, and Nostr
# has no compare-and-swap, so two jobs publishing the same `d` silently lose one
# side's artifacts. Exactly one writer is therefore required, and it has to run
# after every build.
#
# This used to be two files — release.yml (Android) and desktop.yml — firing on
# the same tag and running CONCURRENTLY (the coordinator's
# NGIT_CI_MAX_CONCURRENT_JOBS is above 1). ngit-ci has no `workflow_run`
# trigger, and act resolves `needs:` only WITHIN one invocation, so a job that
# waits for both builds can only exist in the same file as both builds. Hence
# the merge; desktop.yml is gone.
#
# ── The jobs share one working tree ──────────────────────────────────────────
# act binds the same checkout into every job container (`--bind`), so jobs
# without a `needs:` edge run in parallel ON THE SAME FILES. `android` and
# `desktop` both run a web bundle build, with different env — the APK is built
# with analytics structurally excluded, the desktop bundle with empty platform
# relays — so they MUST stay chained. Do not add a job here without a `needs:`
# edge unless it touches nothing.
#
# Order within that chain matters for a second reason: `if: always()` makes the
# job carrying it run past an ancestor's failure, but does NOT rescue the jobs
# downstream of that job. So the build whose failure must not block anything
# goes LAST. `android` publishes to Google Play, which can
# reject for reasons that have nothing to do with the artifacts; when it ran
# first, a Play policy rejection skipped the desktop build and shipped a
# release with no desktop installers.
#
# What they do NOT share is RUNNER_TEMP. Anything one job hands another lives
# in the checkout: `.release-artifacts/`, the files the release event names.
#
# `desktop` is `if: always()` so a Gradle failure costs the Android build and
# nothing else — the two were independent when they were separate files, and
# chaining them for tree safety shouldn't quietly couple their fates.
#
# Ported from the GitLab `build-apk` job (+ ditto's `publish-google-play`) to
# ngit-ci (act / GitHub Actions syntax). The Android build and its Play publish
# stay in ONE job on purpose: act's local artifact server round-trips a
# multi-file wildcard upload back as a 3-byte stub, so files never cross jobs
# via upload/download-artifact — only through the shared checkout. Results and
# artifacts surface on gitworkshop.dev against the tagged commit.
#
# ── Runner image ─────────────────────────────────────────────────────────────
# Jobs run in the coordinator's armada-ci image (NGIT_CI_ACT_PLATFORMS maps
# ubuntu-latest to it), which pre-bakes the JDK/node/go toolcaches, the
# Android SDK and ruby+fastlane, and the coordinator mounts
# persistent ~/.gradle + ~/.npm cache volumes into every job — see
# .ngit/ci-image. Without them every run
# re-downloaded ~700 MB of toolchain+deps and blew the coordinator's 30-min
# default job timeout (NGIT_CI_JOB_TIMEOUT_SECS).
#
# ── Version ──────────────────────────────────────────────────────────────────
# The version is carried by the git tag (vX.Y.Z), never a committed field:
#   VERSION_NAME = tag minus leading "v"   (v2.1.0 -> 2.1.0)
#   VERSION_CODE = major*1_000_000 + minor*1_000 + patch, derived from the tag
#                  (was $CI_PIPELINE_IID on GitLab, then git rev-list --count on
#                  ngit-ci — but ngit-ci shallow-fetches only the tagged commit,
#                  so the count was always 1 and every release got the same code)
#
# ── Secrets (provisioned by the ngit-ci operator for this repo's alias) ──────
# Injected ONLY on maintainer-authored triggers (a tag push by a maintainer
# qualifies). Ask the operator to set, keyed to this repo's #ALIAS:
#   ANDROID_KEYSTORE_BASE64  base64 of the JKS upload keystore (alias: upload)
#   KEYSTORE_PASSWORD        keystore store password
#   KEY_PASSWORD             upload key password (== store password; PKCS12
#                            uses a single password, so the two must match)
#   ZAPSTORE_BUNKER_URL      bunker:// URL of the NIP-46 signer that signs the
#                            kind-30622 release event (the name predates that).
#   ZAPSTORE_CLIENT_KEY      the client secret key that bunker session was
#                            established with (hex or nsec). Both halves are
#                            needed: the URL's one-time `secret=` is long spent,
#                            and what actually authorizes signing is this key,
#                            which the bunker already approved.
#   NSYTE_BUNKER             nbunksec for a session on the Soapbox key, which
#                            owns buzz.armada.app. Signs the NIP-82 release
#                            (and the nsite deploys).
#   KLIPY_API_KEY            (optional) GIF search key baked into the bundles
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#                            (optional, all or none, with the three below) the
#                            Entra app registration that holds the Artifact
#                            Signing "Certificate Profile Signer" role.
#   AZURE_SIGNING_ENDPOINT   (optional) e.g. https://eus.codesigning.azure.net
#   AZURE_SIGNING_ACCOUNT    (optional) Artifact Signing account name
#   AZURE_SIGNING_PROFILE    (optional) its certificate profile name
#                            All six set: Windows executables are Authenticode
#                            signed (electron/scripts/sign-windows.cjs). None:
#                            they ship unsigned. Some: the release fails.
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  (optional) base64 of the Play Console
#                            service-account JSON key with release permission on
#                            buzz.armada.app. Empty (unprovisioned) skips the
#                            Google Play publish instead of failing.
#
# NOTHING here is published over SSH. Every artifact — installers, the APK, the
# .flatpak bundle — is named by the release event and fetched from Blossom by
# hash, and the desktop app self-updates from that same event.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  desktop:
    # First, and NOT chained behind `android`, which now runs after the whole
    # desktop chain. The two must not run concurrently — act binds one checkout
    # into every job container and both build a web bundle into dist/ with
    # different env — but the order between them is otherwise free, and this
    # one is load-bearing.
    #
    # `if: always()` on a job makes THAT job run past an ancestor's failure; it
    # does not rescue the jobs downstream of it. With `android` first, a failed
    # Play upload ran `desktop` and then skipped `publish`, so a
    # perfectly good set of installers was never signed or deployed. Putting
    # the Android build last means nothing it does can gate the desktop
    # release, without relying on `needs.<job>.result` support in act.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: electron/hevc-publisher/go.mod
          cache-dependency-path: electron/hevc-publisher/go.sum

      - name: Build standalone web bundle
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          # OFF in the published sovereign desktop build by default (see the
          # Android release workflow). Configurable for own-branded builds via
          # the provisioned secret; empty = tracker never initialized.
          PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          PLAUSIBLE_ENDPOINT: ${{ secrets.VITE_PLAUSIBLE_ENDPOINT }}
          # Discord bridge portal origin (only the origin of links the user
          # clicks — nothing dialed, no data sent). Empty = affordances hidden.
          BRIDGE_PORTAL_URL: ${{ secrets.VITE_BRIDGE_PORTAL_URL }}
        run: |
          set -eu
          npm ci
          # Mini App multiplayer rides a Rust crate compiled to wasm
          # (crates/webxdc-rt). `npx vite build` below does NOT fire the
          # prebuild hook that `npm run build` would, so build the transport
          # explicitly. WEBXDC_RT_REQUIRED=1 makes a missing toolchain or a
          # failed compile fail the release rather than silently ship the
          # desktop app with multiplayer off. The Rust toolchain is baked into
          # the armada-ci runner image and iroh's compiled dependency tree
          # persists in the coordinator's cargo volumes (.ngit/ci-image).
          WEBXDC_RT_REQUIRED=1 npm run build:wasm
          # No `-l error`: act's log capture drops suppressed output, so a
          # failing/empty build looked like a silent success and only surfaced
          # later as "cp: cannot stat 'dist/index.html'". Keep vite's own output.
          npx vite build
          test -f dist/index.html || { echo "vite build produced no dist/index.html" >&2; ls -la dist || true; exit 1; }
          cp dist/index.html dist/404.html
          # Copy the built bundle INTO electron/dist by content. `electron/dist`
          # may already exist (e.g. a work-dir path act keeps around), so a
          # `rm -rf` + `cp -r` races "cannot create directory: File exists".
          # `cp -rT` copies dist's contents into the (created) target dir
          # regardless of whether it pre-exists.
          mkdir -p electron/dist
          find electron/dist -mindepth 1 -delete
          cp -rT dist electron/dist
          # The shell's ArmadaDB store (electron/db.cjs), built from src/lib/db.
          # main.js requires it at startup, so a missing bundle is not a build
          # failure — it is a shipped app that silently stores the user's data
          # in the wrong place.
          npx vite build -c vite.config.electron.ts
          test -f electron/db.cjs || { echo "no electron/db.cjs" >&2; exit 1; }
          # The updater's release feed (electron/updateFeed.cjs), built from
          # src/lib/desktopUpdate.ts and read through nostrUpdateProvider.js.
          # A missing bundle is not a build failure — it is a shipped app whose
          # every update check fails, which nothing downstream would notice.
          npx vite build -c vite.config.electron-update.ts
          test -f electron/updateFeed.cjs || { echo "no electron/updateFeed.cjs" >&2; exit 1; }

      # electron-builder needs wine for the Windows targets. wine is baked into
      # the armada-ci runner image; this fallback only runs on a stock act
      # image (e.g. someone else's coordinator without the custom image).
      - name: Install wine (fallback for stock runner images)
        run: |
          set -eu
          command -v wine >/dev/null 2>&1 && { echo "wine present: $(wine --version)"; exit 0; }
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine32 wine64 >/dev/null || \
            sudo apt-get install -y --no-install-recommends wine >/dev/null

      - name: Build Linux + Windows installers
        env:
          TAG: ${{ github.ref_name }}
          # Optional Authenticode signing through Azure Artifact Signing (see
          # the secrets list above). Unsigned installed NSIS builds still
          # self-update through the validated feed; signing is what gives the
          # installer a publisher identity and SmartScreen reputation.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          JSIGN_VERSION: "7.5"
          JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*) VERSION="${TAG#v}" ;;
            *) VERSION=0.0.0 ;;
          esac
          # Jsign is fetched only when signing is configured, so an unsigned
          # fork's release has no dependency on GitHub being reachable. The
          # hook itself refuses a partial configuration.
          if [ -n "${AZURE_SIGNING_ACCOUNT:-}" ]; then
            export JSIGN_JAR="$RUNNER_TEMP/jsign-$JSIGN_VERSION.jar"
            curl -fsSL --retry 3 --retry-all-errors -o "$JSIGN_JAR" \
              "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
            echo "$JSIGN_SHA256  $JSIGN_JAR" | sha256sum -c -
          fi
          cd electron
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" package.json
          npm ci --no-audit --no-fund
          ./scripts/build-hevc-publisher.sh --arch x64
          test -x generated/hevc/x64/armada-hevc-publisher
          npx electron-builder --linux --win --config electron-builder.yml --publish never
          test -x release/linux-unpacked/resources/armada-hevc-publisher
          cmp generated/hevc/x64/armada-hevc-publisher \
            release/linux-unpacked/resources/armada-hevc-publisher
          asar_check=$(mktemp -d)
          npx asar extract release/linux-unpacked/resources/app.asar "$asar_check/linux"
          npx asar extract release/win-unpacked/resources/app.asar "$asar_check/windows"
          diff -qr dist "$asar_check/linux/dist"
          diff -qr dist "$asar_check/windows/dist"
          test ! -e "$asar_check/windows/generated"
          test ! -e "$asar_check/windows/flatpak"
          test ! -e "$asar_check/windows/hevc-publisher"

      # Flatpak is deliberately derived from the just-built AppImage, so it
      # contains the identical application bundle. build.sh emits a sideloadable
      # `.flatpak` bundle; the OSTree repo it builds is only the intermediate
      # `flatpak build-bundle` exports from and is never published.
      - name: Install Flatpak tooling (fallback for stock runner images)
        run: |
          set -eu
          if ! command -v flatpak-builder >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends flatpak flatpak-builder >/dev/null
          fi
          # flatpak-builder shells out to elfutils' eu-strip to extract a
          # module's debuginfo, and the armada-ci image has no elfutils. The
          # manifest turns that phase off, so this is the belt to that braces:
          # non-fatal, because if the manifest option holds these binaries are
          # never invoked, and a transient apt failure must not cost a release.
          # Guarded, so an image with elfutils baked in touches nothing.
          if ! command -v eu-strip >/dev/null 2>&1; then
            (sudo apt-get update -qq && \
             sudo apt-get install -y --no-install-recommends elfutils >/dev/null) \
              || echo "warning: elfutils unavailable; relying on the manifest's no-debuginfo"
          fi
          # The armada-ci image bakes in the flathub remote and these runtimes,
          # so on it this step must touch the network for NOTHING: a flaky
          # flathub.org DNS lookup here otherwise fails the whole desktop release
          # for a no-op (observed in CI). Only a stock runner image, which lacks
          # the BaseApp, falls through to the networked remote-add + install.
          if ! flatpak info org.electronjs.Electron2.BaseApp >/dev/null 2>&1; then
            flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
            flatpak install -y flathub \
              org.freedesktop.Platform//25.08 \
              org.freedesktop.Sdk//25.08 \
              org.electronjs.Electron2.BaseApp//25.08
          fi

      # The bundle is unsigned: npkg (pkg.soapbox.pub) is the distribution
      # channel, and it hash-verifies the bundle against the signed kind-30622
      # release event and re-signs its own OSTree summary — so a signature here
      # would be discarded. There is no release GPG key any more.
      - name: Build Flatpak bundle
        run: cd electron && npm run dist:flatpak

      # macOS is cross-built rather than skipped: assembling a .app needs no
      # Apple tooling (it is the prebuilt darwin Electron with our app.asar
      # dropped in), which is what @electron/packager does — electron-builder's
      # refusal off darwin is about SIGNING, not about the bundle. The script
      # reuses the asar electron-builder just staged, so it has to run after the
      # step above. See electron/scripts/package-mac.mjs.
      #
      # Pulls the darwin Electron release (~90 MB per arch) into ~/.cache/
      # electron, a persistent cache volume on the coordinator — only the first
      # run after a version bump pays the download.
      - name: Cross-build macOS app bundles
        run: node electron/scripts/package-mac.mjs

      # An arm64 Mac refuses to exec a binary with no signature at all, so the
      # bundles are ad-hoc signed with rcodesign (Apple's codesign reimplemented
      # in Rust, runs off darwin). This is NOT a Developer ID signature and is
      # not notarized: the app launches, but the first open still needs the user
      # to approve it in System Settings → Privacy & Security → Open Anyway.
      # Real signing would need Apple credentials (rcodesign can do both with a
      # .p12 and an App Store Connect key, if that's ever set up).
      #
      # .zip, not .dmg: a disk image needs HFS+ tooling no act container has.
      # Zip is a first-class macOS distribution format — it's what Electron's
      # own auto-updater consumes.
      - name: Sign and zip the macOS bundles
        env:
          # NOT named RCODESIGN_*: rcodesign reads every RCODESIGN_-prefixed
          # environment variable as a config key and aborts on ones it doesn't
          # know ("UnknownField"), so RCODESIGN_VERSION here would fail the
          # signing command below rather than configure this step.
          CODESIGN_TOOL_VERSION: "0.29.0"
          CODESIGN_TOOL_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
        run: |
          set -eu
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip >/dev/null
          fi

          name="apple-codesign-${CODESIGN_TOOL_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${CODESIGN_TOOL_VERSION}/${name}.tar.gz"
          echo "${CODESIGN_TOOL_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"

          cd electron/release/mac
          for dir in Armada-darwin-*; do
            arch="${dir##*-}"
            # --config-file /dev/null: sign only from these arguments, never
            # from an ambient user/cwd rcodesign.toml.
            "$RUNNER_TEMP/$name/rcodesign" --config-file /dev/null \
              sign "$dir/Armada.app" >/dev/null
            # -y keeps symlinks as symlinks: an Electron .app is full of
            # framework Versions/Current links, and dereferencing them inflates
            # the archive and lands a bundle whose signature no longer verifies.
            (cd "$dir" && zip -qry "../Armada-mac-$arch.zip" Armada.app)
          done
          ls -lh ./*.zip

      # Stage every desktop installer, here in the job that built them — beside
      # the APK the android job already staged. All seven land in one directory
      # named exactly as the release event will name them, so the artifact
      # upload and the event describe the same bytes under the same name.
      # `src/lib/downloads.test.ts` reads those names back and fails if the
      # client can't file one under a platform. The `.flatpak` bundle is staged
      # here with the rest now that it is unsigned — there is no signing gate to
      # defer it past.
      - name: Stage installers for the release event
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          out="$PWD/.release-artifacts"
          mkdir -p "$out"
          # Match electron-builder's versioned name specifically. flatpak/build.sh
          # stages its input beside it as the unversioned Armada.AppImage, so a
          # bare *.AppImage glob matches two files and cp then reads the last
          # argument as a destination directory.
          cp electron/release/Armada-*-linux-*.AppImage "$out/Armada-$TAG.AppImage"
          cp electron/release/*.deb "$out/Armada-$TAG.deb"
          # Anchored to the trailing -Setup.exe so it can't also match the
          # intermediate Armada-<ver>-Setup.__uninstaller.exe.
          cp electron/release/Armada-*-Setup.exe "$out/Armada-$TAG.exe"
          # The portable build is the non-Setup .exe.
          cp "$(ls electron/release/*.exe | grep -iv setup | head -n1)" "$out/Armada-$TAG-portable.exe"
          # .zip names its platform, since the extension doesn't.
          cp electron/release/mac/Armada-mac-x64.zip "$out/Armada-$TAG-mac-x64.zip"
          cp electron/release/mac/Armada-mac-arm64.zip "$out/Armada-$TAG-mac-arm64.zip"
          # The unsigned Flatpak bundle. npkg re-signs on import.
          cp electron/release/Armada-flatpak-*.flatpak "$out/Armada-$TAG.flatpak"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: armada-desktop-linux-${{ github.ref_name }}
          path: |
            .release-artifacts/Armada-${{ github.ref_name }}.AppImage
            .release-artifacts/Armada-${{ github.ref_name }}.deb
            .release-artifacts/Armada-${{ github.ref_name }}.flatpak
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: armada-desktop-windows-${{ github.ref_name }}
          path: |
            .release-artifacts/Armada-${{ github.ref_name }}.exe
            .release-artifacts/Armada-${{ github.ref_name }}-portable.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: armada-desktop-mac-${{ github.ref_name }}
          path: |
            .release-artifacts/Armada-${{ github.ref_name }}-mac-x64.zip
            .release-artifacts/Armada-${{ github.ref_name }}-mac-arm64.zip
          if-no-files-found: error

      # Runs after any failure in this job — including one before an installer
      # exists — so `warn`, not `error`. The raw build output is the same bytes
      # the staging step copies.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: armada-desktop-failed-${{ github.ref_name }}
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.exe
            electron/release/*.flatpak
            electron/release/mac/*.zip
          if-no-files-found: warn

  android:
    # Last, and `always()`, so its outcome is nobody else's problem. It shares
    # the working tree with `desktop` (see there), so it cannot run beside it;
    # running it after the desktop chain means a Play Console rejection costs
    # the Android publish alone.
    needs: [desktop]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # ngit-ci shallow-fetches the tagged commit regardless of fetch-depth;
        # version_code is derived from the tag, so depth doesn't matter here.

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No setup-android / setup-ruby steps: the Android SDK and ruby+fastlane
      # are baked into the coordinator's
      # armada-ci runner image (see .ngit/ci-image/Dockerfile), along with the
      # toolcaches that make the setup-node/setup-java actions above no-ops.

      - name: Derive version
        id: version
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          # versionCode is derived from the semver tag, NOT git rev-list --count
          # HEAD: ngit-ci's embedded-act runner shallow-fetches only the tagged
          # commit (git fetch --depth=1 origin <oid>), so the commit count is
          # always 1 and every release would get the same code. Deriving from the
          # tag makes the code deterministic, monotonic with semver, and
          # independent of checkout depth.
          #
          # Scheme: major*1_000_000 + minor*1_000 + patch.
          # At 0.31.x this yields 31_000+, already above the GitLab-era ceiling
          # (last release v0.30.1 = 402) and above the first ngit-ci release
          # (v0.31.0 = 10_001). minor/patch each support up to 999.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE="$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME (code $VERSION_CODE) from tag $TAG"

      - name: Stamp version into android/app/build.gradle
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -eu
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 secret.}"
          : "${KEYSTORE_PASSWORD:?Set the KEYSTORE_PASSWORD secret.}"

          rm -f android/key.properties android/app/my-upload-key.jks android/app/my-upload-key.keystore
          umask 077

          # Decode the JKS and migrate JKS -> PKCS12 for Gradle. PKCS12 uses a
          # single password, so key and store passwords must match (that is the
          # KEY_PASSWORD == KEYSTORE_PASSWORD invariant).
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/my-upload-key.jks
          keytool -importkeystore \
            -srckeystore android/app/my-upload-key.jks \
            -destkeystore android/app/my-upload-key.keystore \
            -deststoretype pkcs12 \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -srcalias upload \
            -destalias upload \
            -noprompt
          rm android/app/my-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=upload
          storeFile=my-upload-key.keystore
          EOF

      - name: Build web assets and sync into Capacitor
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          # Discord bridge portal origin. Only the origin of links the user
          # clicks (nothing is dialed on boot, no Armada data is sent), so
          # unlike PLAUSIBLE_* below there is no sovereignty reason to
          # keep it out of the APK. Empty = every Discord affordance hidden.
          BRIDGE_PORTAL_URL: ${{ secrets.VITE_BRIDGE_PORTAL_URL }}
        run: |
          set -eu
          # Analytics is structurally EXCLUDED from the APK. Baking armada.buzz
          # telemetry into every self-hoster's install would betray "your keys,
          # your fleet", so this build never wires the VITE_PLAUSIBLE_* secrets
          # into its env. Not merely "off by default": those secrets remain
          # provisioned for this repo's alias (they were the hosted web deploy's,
          # and no workflow consumes them since it was removed), so passing them
          # through here would silently ship a tracking APK. We also unset them
          # defensively, so reintroducing them at job/global scope can't leak the
          # tracker into the bundle. If you ever want a branded APK WITH
          # analytics, add the env back on this step deliberately — don't rely on
          # the secret being unprovisioned.
          unset PLAUSIBLE_DOMAIN PLAUSIBLE_ENDPOINT VITE_PLAUSIBLE_DOMAIN VITE_PLAUSIBLE_ENDPOINT
          npm ci
          # Mini App multiplayer rides a Rust crate compiled to wasm
          # (crates/webxdc-rt). `npx vite build` below does NOT fire the
          # prebuild hook that `npm run build` would, so build the transport
          # explicitly. WEBXDC_RT_REQUIRED=1 makes a missing toolchain or a
          # failed compile fail the release rather than silently ship the APK
          # with multiplayer off. The Rust toolchain is baked into the armada-ci
          # runner image and iroh's compiled dependency tree persists in the
          # coordinator's cargo volumes (.ngit/ci-image).
          WEBXDC_RT_REQUIRED=1 npm run build:wasm
          npx vite build
          test -f dist/index.html || { echo "vite build produced no dist/index.html" >&2; ls -la dist || true; exit 1; }
          cp dist/index.html dist/404.html
          npx cap sync android

      - name: Build signed release APK + AAB
        run: |
          set -eu
          cd android
          chmod +x gradlew
          # Two invocations, because the ABI set differs between the outputs.
          # The AAB carries all four ABIs: Play splits it per device, so the
          # x86 pair costs its users nothing and is what an x86_64 Chromebook
          # or emulator installs.
          # The APK is UNIVERSAL — one file, every ABI, downloaded whole — and
          # libsecp256k1-jni.so + libsqliteJni.so are ~2.5 MB per ABI, so the
          # x86 pair was 5 MB of dead weight on every phone. -PapkAbis drops
          # them from the download only (see android/app/build.gradle).
          ./gradlew bundleRelease
          ./gradlew assembleRelease -PapkAbis=armeabi-v7a,arm64-v8a

      - name: Collect and name artifacts
        id: artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          out="$RUNNER_TEMP/armada-android-v$VERSION_NAME"
          mkdir -p "$out"
          cp android/app/build/outputs/apk/release/app-release.apk "$out/Armada-v$VERSION_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$out/Armada-v$VERSION_NAME.aab"
          # The release build is minified, so a stack trace from a sideloaded
          # or Zapstore install is unreadable without this. (Play needs no
          # copy: AGP embeds the map in the AAB as
          # BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map.)
          # It is the APK build's map, written by the assembleRelease that ran
          # last above.
          cp android/app/build/outputs/mapping/release/mapping.txt \
            "$out/Armada-v$VERSION_NAME-apk-mapping.txt"
          ls -lh "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

          # A second copy, inside the CHECKOUT, for the `release` job to name in
          # the release event. Dependent ngit-ci jobs share the working tree but
          # not RUNNER_TEMP, so $out above is invisible from there.
          #
          # The APK only. An .aab is Play's upload format and cannot be
          # installed by a user, so offering one would be a trap; the ProGuard
          # map is a debugging aid, not a download. Both stay run artifacts.
          mkdir -p "$PWD/.release-artifacts"
          cp "$out/Armada-v$VERSION_NAME.apk" "$PWD/.release-artifacts/Armada-v$VERSION_NAME.apk"

      # The APK/AAB are signed now; remove the keystore and password file.
      - name: Remove release signing material
        if: ${{ always() }}
        run: |
          rm -f android/key.properties android/app/my-upload-key.jks android/app/my-upload-key.keystore

      # Publish the APK + AAB as run artifacts (they surface on gitworkshop.dev
      # against the tagged commit). Done BEFORE the Play publish so the
      # artifacts exist even if Google Play fails. Upload is safe here — act's
      # broken artifact path is cross-job DOWNLOAD, not same-job upload.
      - name: Upload APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armada-android-v${{ steps.version.outputs.name }}
          path: |
            ${{ steps.artifacts.outputs.dir }}/Armada-v${{ steps.version.outputs.name }}.apk
            ${{ steps.artifacts.outputs.dir }}/Armada-v${{ steps.version.outputs.name }}.aab
            ${{ steps.artifacts.outputs.dir }}/Armada-v${{ steps.version.outputs.name }}-apk-mapping.txt

      # Publish the AAB to Google Play in the SAME job (ported from ditto's
      # GitLab `publish-google-play` job). Cross-job artifact hand-off is broken
      # under act (see the header), so the AAB must stay on this
      # runner's disk. The publish step skips itself in-shell when the
      # service-account secret isn't provisioned, so releases keep working
      # before the operator sets it up. The skip CANNOT be a step-level
      # `if: ${{ secrets.X != '' }}` — act's schema validator (like GitHub)
      # rejects the `secrets` context in `if:` ("Unknown Variable Access
      # secrets") and the whole workflow fails validation before running.
      # ruby + fastlane are baked into the runner image (incl. multi_json,
      # which representable in fastlane's Play client requires without
      # declaring — see .ngit/ci-image/Dockerfile).
      - name: Publish to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          ARTIFACT_DIR: ${{ steps.artifacts.outputs.dir }}
        run: |
          set -eu

          # No key provisioned (or non-maintainer trigger): skip the publish.
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set; skipping Google Play publish."
            exit 0
          fi

          aab_path="$ARTIFACT_DIR/Armada-v$VERSION_NAME.aab"
          test -f "$aab_path"

          # Build the fastlane supply metadata layout for the changelog. supply
          # maps changelogs/<versionCode>.txt to the Play Console "What's new in
          # this version" field. versionCode matches what was stamped into
          # build.gradle above (derived from the tag).
          summary="$(node scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" --summary)"
          changelog_dir="android/fastlane/metadata/android/en-US/changelogs"
          mkdir -p "$changelog_dir"
          printf '%s\n' "$summary" > "$changelog_dir/$VERSION_CODE.txt"
          echo "--- $changelog_dir/$VERSION_CODE.txt ---"
          cat "$changelog_dir/$VERSION_CODE.txt"
          echo "-------------------------------------------"
          # Warn (don't fail) over the documented 500-character limit so it's
          # spotted before the Play Console rejects the upload.
          summary_len=$(wc -c < "$changelog_dir/$VERSION_CODE.txt")
          if [ "$summary_len" -gt 501 ]; then
            echo "WARNING: changelog is $summary_len bytes; convention is <=500."
          fi

          # Decode the base64 service-account JSON to a temp file for fastlane.
          umask 077
          json_key="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > "$json_key"

          # Upload the AAB to the production track with the changelog. The other
          # metadata (title, description, images, screenshots) is managed in the
          # Play Console and left untouched. No --release_status: supply defaults
          # to "completed", so the upload rolls out on the production track (this
          # matches ditto's working publish-google-play job). It previously
          # passed "draft" because the app had never been published and the API
          # refuses "completed" releases for a draft app; the app is live now.
          # Bounded with `timeout`: fastlane supply talks to the Play Developer API and will sit on a stalled
          # connection indefinitely. 1800s is generous for a 14 MB AAB upload.
          #
          # `tee`d to a file so the App-content check below can grep it, and
          # streamed live (not buffered) so a hang still leaves a trace on the
          # console — act truncates a failing step's console log and this step's
          # whole failure mode is one line near the end. The file stays on the
          # runner and is NOT uploaded anywhere.
          out="${RUNNER_TEMP:-/tmp}/fastlane-supply-output.txt"
          set +e
          timeout --signal=TERM --kill-after=30 1800 \
          fastlane supply \
            --aab "$aab_path" \
            --package_name buzz.armada.app \
            --track production \
            --json_key "$json_key" \
            --metadata_path android/fastlane/metadata/android \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots \
            --skip_upload_apk 2>&1 | tee "$out"
          supply_rc=${PIPESTATUS[0]}
          set -e
          echo "=== fastlane supply finished (rc=$supply_rc) ==="

          # An app-content answer that Google is still waiting for fails
          # `edits.commit`, NOT the upload: supply uploads the AAB, updates the
          # track, and only then gets "Invalid request - You must let us know
          # whether your app uses any full-screen intent permissions". A failed
          # commit discards the whole edit, so the bundle never enters the
          # library and the Play listing simply does not move — while every
          # other artifact of the release publishes normally. That is what
          # stalled Play at 0.51.2 from 2026-08-11 while eight releases shipped
          # everywhere else. It is a Play Console action (App content), not
          # anything this workflow can send, so say so rather than leaving the
          # next reader to diff this job against a working one.
          if [ "$supply_rc" -ne 0 ] && grep -qi "you must let us know\|required to tell Google Play\|declaration\|app content" "$out"; then
            echo "Google rejected the COMMIT, not the upload: the Play Console is" >&2
            echo "waiting on an App content declaration. Answer it at" >&2
            echo "Play Console > buzz.armada.app > Policy > App content, then" >&2
            echo "re-run this job — no code change here will help." >&2
          fi
          if [ "$supply_rc" -eq 124 ] || [ "$supply_rc" -eq 137 ]; then
            echo "fastlane supply exceeded the 1800s deadline and was killed." >&2
          fi
          exit "$supply_rc"

      - name: Remove Google Play service account key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/play-service-account.json"


  # The single writer of both release events. `needs:` both build paths so it
  # can name every artifact in one kind-30622 event (docs/releases.md) and one
  # NIP-82 release — both addressable, replacement is whole-event rather than a
  # tag union, and Nostr has no compare-and-swap, so a second publisher would
  # silently drop one side's artifacts rather than merge with them.
  #
  # `always()` so the kind-30622 release still goes out when one platform
  # failed, carrying whatever was built. The script refuses to publish an empty
  # release, so a run where nothing built fails here instead of announcing a
  # version with no downloads. The NIP-82 release is all-or-nothing: ngit
  # refuses a manifest file that doesn't exist and a `main` release missing one
  # of the application's platforms.
  release:
    needs: [android, desktop]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No checkout step: dependent ngit-ci jobs bind the same working tree, so
      # the sources, the node_modules the android job installed, and the
      # .release-artifacts/ both build jobs staged into are all already here.
      - name: Publish the NIP-34 release event
        # The only deadline this step actually has. act parses a JOB's
        # `timeout-minutes` and merely debug-logs it — the `timeout-minutes: 30`
        # above has never fired — while it does enforce a STEP's. v0.56.2
        # published its release event and then failed to exit, and sat here for
        # 40 minutes until the coordinator's run-level timeout fired; that
        # timeout replaces every job result act has already reported with one
        # synthetic entry, so the run lost the logs of four finished jobs to a
        # step that had already done its work. Generous, because ~700 MB of
        # first-time Blossom uploads legitimately take a while.
        timeout-minutes: 25
        env:
          # Two halves of one NIP-46 session, both required: the bunker URL names the remote signer and its relay,
          # the client key is what that signer already authorized.
          NOSTR_BUNKER_URL: ${{ secrets.ZAPSTORE_BUNKER_URL }}
          NOSTR_CLIENT_KEY: ${{ secrets.ZAPSTORE_CLIENT_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          : "${NOSTR_BUNKER_URL:?Set the ZAPSTORE_BUNKER_URL secret.}"
          : "${NOSTR_CLIENT_KEY:?Set the ZAPSTORE_CLIENT_KEY secret.}"

          if [ ! -d .release-artifacts ]; then
            echo "No .release-artifacts/ directory: every build job failed." >&2
            exit 1
          fi
          ls -lh .release-artifacts

          # Most blobs are already on Blossom — ngit-ci uploads run artifacts to
          # the first of these servers — so this mostly hashes files and
          # confirms hits. It uploads only what the coordinator dropped, which
          # is why a 413 or an exhausted upload budget upstream costs a little
          # time here rather than a missing download.
          #
          # All three of the client's servers (.nsite/config.json, the same
          # list every nsite deploy uses), so an artifact that no server holds
          # yet lands on the first live one and the others are asked to mirror
          # it AFTER the release event is out — a dead mirror can slow the
          # release, never block it.
          #
          # GITHUB_SHA is the tagged commit; the event records it because kind
          # 30618 goes stale and a release that can't state its own provenance
          # isn't self-sufficient.
          BLOSSOM_SERVERS="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(".nsite/config.json","utf8")).servers.join(","))')"
          export BLOSSOM_SERVERS
          node scripts/publish-release.mjs \
            --version "$TAG" \
            --commit "$GITHUB_SHA" \
            --dir .release-artifacts

      - uses: danconwaydev/setup-ngit@v3
        if: ${{ always() }}

      # The NIP-82 release (.ngit/release.yaml) of buzz.armada.app, which
      # Zapstore reads. Runs whether or not the kind-30622 step above
      # succeeded: the two are read by different clients and neither should
      # cost the other. Runs after it so the blobs are already on Blossom.
      - name: Publish the NIP-82 release
        if: ${{ always() }}
        # A STEP deadline, for the reason given on the step above.
        timeout-minutes: 25
        env:
          NSYTE_BUNKER: ${{ secrets.NSYTE_BUNKER }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          : "${NSYTE_BUNKER:?NSYTE_BUNKER is not set; ask the ngit-ci operator to provision it for this repository.}"
          umask 077
          printf '%s' "$NSYTE_BUNKER" > "$RUNNER_TEMP/nbunksec"
          # The checkout's remote is the coordinator's clone, so name the
          # repository. The checkout has the tagged commit but not the tag
          # itself, so the version and commit are given rather than found.
          # Version without the "v", continuing buzz.armada.app@X.Y.Z.
          ngit release publish "${TAG#v}" --defaults \
            --repo nostr://npub10qdp2fc9ta6vraczxrcs8prqnv69fru2k6s2dj48gqjcylulmtjsg9arpj/relay.ngit.dev/armada \
            --commit "$GITHUB_SHA" \
            --nbunksec-file "$RUNNER_TEMP/nbunksec"

      - name: Remove the signer
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/nbunksec"
